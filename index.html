<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    // Automatically recover from Vite dynamic import chunk errors on deployments
    window.addEventListener('vite:preloadError', (event) => {
      console.warn('Vite preload error caught. Reloading page to load the latest build assets...', event);
      window.location.reload();
    });
  </script>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030712" />

  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://api.nexbotix.online" crossorigin />
  <link rel="dns-prefetch" href="https://accounts.google.com" />

  <!-- Preload LCP element -->
  <link rel="preload" href="/demo-video-poster.webp" as="image" type="image/webp" />
  <title>NexBotix — WhatsApp &amp; Email Bulk Messaging Platform</title>
  <meta name="description"
    content="Send bulk WhatsApp &amp; Email messages easily and efficiently. Connect your number, upload contacts, and launch campaigns instantly with NexBotix." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nexbotix.online/" />
  <meta property="og:title" content="NexBotix — WhatsApp &amp; Email Bulk Messaging" />
  <meta property="og:description"
    content="Send bulk WhatsApp &amp; Email messages easily and efficiently. Connect your number, upload contacts, and launch campaigns instantly." />
  <meta property="og:image" content="https://nexbotix.online/icon-512.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://nexbotix.online/" />
  <meta property="twitter:title" content="NexBotix — WhatsApp &amp; Email Bulk Messaging" />
  <meta property="twitter:description" content="Send bulk WhatsApp &amp; Email messages easily and efficiently." />
  <meta property="twitter:image" content="https://nexbotix.online/icon-512.png" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Chatbot script loaded async via React useEffect in main.tsx -->
</body>

</html>
